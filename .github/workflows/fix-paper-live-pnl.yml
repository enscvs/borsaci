name: Inspect paper live PnL block

on: push

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show target context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("server.js").read_text()
          needle = "position.current = current;"
          start = 0
          hits = []
          while True:
              i = s.find(needle, start)
              if i < 0:
                  break
              hits.append(i)
              start = i + 1
          print("HITS", len(hits), hits)
          for i in hits:
              print("---CONTEXT---")
              print(s[max(0, i-500):i+900])
          PY
