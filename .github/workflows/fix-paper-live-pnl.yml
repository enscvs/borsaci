name: Fix paper live PnL persistence

on:
  push:
    paths:
      - '.github/workflows/fix-paper-live-pnl.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server.js
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server.js')
          text = path.read_text()
          old = '''      position.current = current;
      position.pnl =
        (current - Number(position.entry)) *
        Number(position.quantity);
'''
          new = '''      const previousCurrent = Number(position.current);
      const previousPnl = Number(position.pnl);
      const nextPnl = roundTradingValue(
        (current - Number(position.entry)) *
        Number(position.quantity)
      );

      position.current = current;
      position.pnl = nextPnl;

      // Açık pozisyonlarda TP/SL olmasa bile fiyat ve PnL değişimi state'e
      // yazılmalı; aksi halde arayüz son kaydedilen fiyatı göstermeye devam eder.
      if (
        !Number.isFinite(previousCurrent) ||
        previousCurrent !== current ||
        !Number.isFinite(previousPnl) ||
        previousPnl !== nextPnl
      ) {
        changed = true;
      }
'''
          if old not in text:
              raise SystemExit('Target block not found; refusing to patch')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git diff --cached --check
          git commit -m "Persist live paper position price and PnL"
          git push
