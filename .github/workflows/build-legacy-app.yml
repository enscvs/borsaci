name: Build legacy iPhone app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/app.js"
      - "public/legacy-polyfills.js"
      - ".github/workflows/build-legacy-app.yml"

permissions:
  contents: write

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Build iOS 10 bundle with Babel
        run: |
          cat > /tmp/babel.config.json <<'JSON'
          {
            "presets": [
              ["@babel/preset-env", {
                "targets": { "ios": "10" },
                "modules": false,
                "bugfixes": true
              }]
            ]
          }
          JSON
          npx --yes -p @babel/core@7.28.4 -p @babel/cli@7.28.3 -p @babel/preset-env@7.28.3 \
            babel public/app.js \
            --config-file /tmp/babel.config.json \
            --out-file /tmp/app-legacy-core.js
          cat public/legacy-polyfills.js /tmp/app-legacy-core.js > public/app-legacy.js
          if grep -Eq '[0-9]_[0-9]' public/app-legacy.js; then
            echo "Legacy build still contains numeric separators" >&2
            exit 1
          fi
          node --check public/app-legacy.js

      - name: Commit generated legacy bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-legacy.js
          if git diff --cached --quiet; then
            echo "Legacy bundle already current"
            exit 0
          fi
          git commit -m "Build static iOS 10 app bundle"
          git pull --rebase origin main
          git push origin main
