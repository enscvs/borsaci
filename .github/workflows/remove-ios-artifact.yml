name: Remove temporary iOS IPA release

on:
  workflow_dispatch:
  push:
    branches: [ios-personal-app]
    paths:
      - ".github/workflows/remove-ios-artifact.yml"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ios-personal-1 --repo enscvs/borsaci --yes --cleanup-tag
